{% load static %}
<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Meu Financeiro</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Architects+Daughter&family=Patrick+Hand&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --bg-blue: #e0f2fe; /* Azul bebê bem claro */
            --blue-dark: #0284c7; /* Azul escuro para contrastes */
            --blue-medium: #38bdf8; 
            --border-dark: #1e3a8a; /* Borda preta azulada */
        }

        body, html {
            height: 100%;
            margin: 0;
            font-family: 'Patrick Hand', cursive, sans-serif;
        }

        .login-wrapper {
            display: flex;
            height: 100vh;
            width: 100vw;
        }

        /* LADO ESQUERDO - AZUL BEBÊ COM DESENHOS SVG */
        .login-left {
            flex: 1;
            background-color: var(--bg-blue);
            /* Desenho SVG de linhas de caderno e ondas suaves */
            background-image: url("data:image/svg+xml,%3Csvg width='100%25' height='100%25' viewBox='0 0 1440 800' xmlns='http://www.w3.org/2000/svg'%3E%3Cdefs%3E%3Cpattern id='lines' width='100%25' height='28' patternUnits='userSpaceOnUse'%3E%3Cline x1='0' y1='27' x2='100%25' y2='27' stroke='%23bae6fd' stroke-width='1'/%3E%3C/pattern%3E%3C/defs%3E%3Crect width='100%25' height='100%25' fill='url(%23lines)'/%3E%3Cpath d='M0 600 Q 360 500 720 600 T 1440 600 L 1440 800 L 0 800 Z' fill='%237dd3fc' opacity='0.4'/%3E%3Cpath d='M0 700 Q 360 650 720 700 T 1440 700 L 1440 800 L 0 800 Z' fill='%23bae6fd' opacity='0.6'/%3E%3C/svg%3E");
            background-size: cover;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 3rem;
            text-align: center;
            position: relative;
            border-right: 4px solid var(--border-dark);
        }

        /* Fita adesiva decorativa */
        .login-left::before {
            content: '';
            position: absolute;
            top: 30px;
            left: 50%;
            transform: translateX(-50%) rotate(-2deg);
            width: 160px;
            height: 35px;
            background-color: rgba(255, 255, 255, 0.6);
            border: 1px solid rgba(30, 58, 138, 0.2);
        }

        .brand-logo {
            font-family: 'Architects Daughter', cursive;
            font-size: 3.8rem;
            font-weight: bold;
            color: var(--border-dark);
            text-shadow: 3px 3px 0px rgba(255,255,255,0.8);
            margin-bottom: 1rem;
            z-index: 1;
            line-height: 1.1;
        }

        .brand-subtitle {
            font-size: 1.3rem;
            color: var(--border-dark);
            z-index: 1;
            max-width: 400px;
            background-color: rgba(255, 255, 255, 0.7);
            padding: 15px;
            border: 2px dashed var(--blue-dark);
            border-radius: 8px;
            transform: rotate(1deg);
            box-shadow: 4px 4px 0px rgba(0,0,0,0.05);
        }

        /* LADO DIREITO - FORMULÁRIO */
        .login-right {
            flex: 1;
            background-color: #f8fafc;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 2rem;
        }

        .form-container {
            width: 100%;
            max-width: 400px;
            background: white;
            padding: 3rem 2.5rem;
            border: 3px solid var(--border-dark);
            box-shadow: 8px 8px 0px var(--border-dark);
            border-radius: 4px;
            position: relative;
        }

        /* Fita adesiva azul no formulário */
        .form-container::before {
            content: '';
            position: absolute;
            top: -15px;
            right: 30px;
            transform: rotate(5deg);
            width: 80px;
            height: 30px;
            background-color: var(--blue-medium); 
            border: 1px solid var(--border-dark);
            box-shadow: 1px 1px 3px rgba(0,0,0,0.1);
        }

        .form-title {
            font-family: 'Architects Daughter', cursive;
            font-size: 2rem;
            color: var(--border-dark);
            margin-bottom: 0.5rem;
        }

        .form-control {
            border: 2px solid var(--border-dark) !important;
            border-radius: 4px !important;
            background-color: #f8fafc !important;
            font-family: 'Patrick Hand', cursive;
            font-size: 1.1rem;
            padding: 0.6rem 0.8rem;
        }

        .form-control:focus {
            box-shadow: 3px 3px 0px rgba(56, 189, 248, 0.4) !important;
            border-color: var(--blue-dark) !important;
            background-color: #fff !important;
        }

        .input-group-text {
            background-color: var(--bg-blue);
            border: 2px solid var(--border-dark);
            border-right: none;
            color: var(--border-dark);
            font-size: 1.1rem;
        }

        .btn-login {
            background: var(--blue-medium);
            border: 2px solid var(--border-dark);
            border-radius: 4px;
            color: var(--border-dark);
            padding: 0.8rem;
            font-family: 'Architects Daughter', cursive;
            font-size: 1.2rem;
            box-shadow: 4px 4px 0px var(--border-dark);
            transition: all 0.1s;
        }

        .btn-login:hover {
            background: var(--blue-dark);
            color: #fff;
            transform: translate(2px, 2px);
            box-shadow: 2px 2px 0px var(--border-dark);
        }

        /* Responsividade */
        @media (max-width: 768px) {
            .login-left {
                display: none;
            }
        }
    </style>
</head>
<body>

    <div class="login-wrapper">
        <!-- LADO ESQUERDO (AZUL BEBÊ COM DESENHOS) -->
        <div class="login-left d-none d-md-flex">
            <div class="brand-logo">
                Meu<br>Financeiro
            </div>
            <div class="brand-subtitle">
                Anote, planeje e conquiste seus objetivos.
            </div>
        </div>

        <!-- LADO DIREITO (FORMULÁRIO) -->
        <div class="login-right">
            <div class="form-container">
                <div class="mb-4">
                    <div class="form-title">Acesse seu Caderno</div>
                    <p class="text-muted small" style="font-size: 1rem;">Insira suas credenciais para continuar.</p>
                </div>

                {% if form.errors %}
                    <div class="alert alert-danger py-2 text-center fw-bold" style="border: 2px solid var(--border-dark); background-color: #fecaca; color: var(--border-dark);">
                        <i class="bi bi-exclamation-triangle"></i> Usuário ou senha incorretos.
                    </div>
                {% endif %}

                <form method="post" action="{% url 'login' %}">
                    {% csrf_token %}
                    
                    <div class="mb-3">
                        <label class="form-label fw-bold text-dark">Usuário</label>
                        <div class="input-group">
                            <span class="input-group-text"><i class="bi bi-person"></i></span>
                            <input type="text" name="username" class="form-control" placeholder="Seu usuário" required autofocus>
                        </div>
                    </div>

                    <div class="mb-4">
                        <label class="form-label fw-bold text-dark">Senha</label>
                        <div class="input-group">
                            <span class="input-group-text"><i class="bi bi-lock"></i></span>
                            <input type="password" name="password" class="form-control" placeholder="Sua senha" required>
                        </div>
                    </div>

                    <button type="submit" class="btn btn-login w-100">
                        Entrar <i class="bi bi-box-arrow-in-right"></i>
                    </button>
                    
                    <input type="hidden" name="next" value="{{ next }}">
                </form>
            </div>
        </div>
    </div>

</body>
</html>
