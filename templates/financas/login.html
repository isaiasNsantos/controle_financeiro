{% load static %}
<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Meu Financeiro</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css" rel="stylesheet">
    <style>
        /* Reset básico para ocupar a tela toda sem scroll */
        body, html {
            height: 100%;
            margin: 0;
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        }

        .login-wrapper {
            display: flex;
            height: 100vh;
            width: 100vw;
        }

        /* LADO ESQUERDO - ARTE E LOGO */
        .login-left {
            flex: 1;
            background: linear-gradient(135deg, #1e1b4b 0%, #8b5cf6 100%);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            color: white;
            padding: 3rem;
            text-align: center;
            position: relative;
            overflow: hidden;
        }

        /* Efeito de círculos abstratos no fundo */
        .login-left::before {
            content: '';
            position: absolute;
            top: -10%;
            left: -10%;
            width: 300px;
            height: 300px;
            background: rgba(255,255,255,0.1);
            border-radius: 50%;
        }
        .login-left::after {
            content: '';
            position: absolute;
            bottom: -10%;
            right: -10%;
            width: 400px;
            height: 400px;
            background: rgba(255,255,255,0.05);
            border-radius: 50%;
        }

        .brand-logo {
            font-size: 3rem;
            font-weight: 800;
            letter-spacing: -1px;
            z-index: 1;
            margin-bottom: 1rem;
        }

        .brand-subtitle {
            font-size: 1.1rem;
            color: rgba(255,255,255,0.8);
            z-index: 1;
            max-width: 400px;
        }

        /* LADO DIREITO - FORMULÁRIO */
        .login-right {
            flex: 1;
            background-color: #f8fafc;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 2rem;
        }

        .form-container {
            width: 100%;
            max-width: 400px;
            background: white;
            padding: 3rem 2.5rem;
            border-radius: 16px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.05);
        }

        .form-control {
            border-radius: 8px;
            padding: 0.8rem 1rem;
            border: 1px solid #e2e8f0;
            background-color: #f8fafc;
        }

        .form-control:focus {
            box-shadow: 0 0 0 3px rgba(139, 92, 246, 0.2);
            border-color: #8b5cf6;
        }

        .input-group-text {
            background-color: #f8fafc;
            border: 1px solid #e2e8f0;
            border-right: none;
            color: #64748b;
        }

        .btn-login {
            background: #8b5cf6;
            border: none;
            border-radius: 8px;
            padding: 0.8rem;
            font-weight: 600;
            transition: all 0.3s ease;
        }

        .btn-login:hover {
            background: #7c3aed;
            transform: translateY(-2px);
        }

        /* Responsividade: esconde o lado esquerdo no celular */
        @media (max-width: 768px) {
            .login-left {
                display: none;
            }
        }
    </style>
</head>
<body>

    <div class="login-wrapper">
        <!-- LADO ESQUERDO -->
        <div class="login-left d-none d-md-flex">
            <div class="brand-logo">
                Meu Financeiro
            </div>
            <div class="brand-subtitle">
                Controle seus gastos, projete o futuro e conquiste seus objetivos com clareza e segurança.
            </div>
        </div>

        <!-- LADO DIREITO -->
        <div class="login-right">
            <div class="form-container">
                <div class="mb-4">
                    <h3 class="fw-bold" style="color: #1e1b4b;">Acesse sua conta</h3>
                    <p class="text-muted small">Bem-vindo de volta! Insira suas credenciais.</p>
                </div>

                {% if form.errors %}
                    <div class="alert alert-danger py-2 text-center small fw-bold border-0" style="background-color: #fee2e2; color: #b91c1c;">
                        <i class="bi bi-exclamation-triangle"></i> Usuário ou senha incorretos.
                    </div>
                {% endif %}

                <form method="post" action="{% url 'login' %}">
                    {% csrf_token %}
                    
                    <div class="mb-3">
                        <label class="form-label small fw-bold text-muted text-uppercase" style="font-size: 0.75rem;">Usuário</label>
                        <div class="input-group">
                            <span class="input-group-text"><i class="bi bi-person"></i></span>
                            <input type="text" name="username" class="form-control" placeholder="Seu usuário" required autofocus>
                        </div>
                    </div>

                    <div class="mb-4">
                        <label class="form-label small fw-bold text-muted text-uppercase" style="font-size: 0.75rem;">Senha</label>
                        <div class="input-group">
                            <span class="input-group-text"><i class="bi bi-lock"></i></span>
                            <input type="password" name="password" class="form-control" placeholder="Sua senha" required>
                        </div>
                    </div>

                    <button type="submit" class="btn btn-primary btn-login w-100 text-white shadow-sm">
                        Entrar
                    </button>
                    
                    <input type="hidden" name="next" value="{{ next }}">
                </form>
            </div>
        </div>
    </div>

</body>
</html>
