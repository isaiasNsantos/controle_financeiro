{% load static %}
<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Meu Financeiro</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css" rel="stylesheet">
    <link rel="stylesheet" href="{% static 'css/style.css' %}">
    <style>
        body {
            display: flex;
            align-items: center;
            justify-content: center;
            height: 100vh;
            background: linear-gradient(135deg, #1e1b4b, #8b5cf6);
        }
        .login-card {
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(10px);
            border-radius: 15px;
            border: none;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
            width: 100%;
            max-width: 400px;
            padding: 2rem;
        }
    </style>
</head>
<body>

    <div class="login-card">
        <div class="text-center mb-4">
            <h2 class="fw-bold" style="color: #1e1b4b;">💰 Meu Financeiro</h2>
            <p class="text-muted small">Acesse sua conta para continuar</p>
        </div>

        {% if form.errors %}
            <div class="alert alert-danger py-2 text-center small fw-bold">
                Usuário ou senha incorretos. Tente novamente.
            </div>
        {% endif %}

        <form method="post" action="{% url 'login' %}">
            {% csrf_token %}
            
            <div class="mb-3">
                <label class="form-label label-mini text-dark">Usuário</label>
                <div class="input-group">
                    <span class="input-group-text bg-white"><i class="bi bi-person"></i></span>
                    <input type="text" name="username" class="form-control" placeholder="Seu usuário" required autofocus>
                </div>
            </div>

            <div class="mb-4">
                <label class="form-label label-mini text-dark">Senha</label>
                <div class="input-group">
                    <span class="input-group-text bg-white"><i class="bi bi-lock"></i></span>
                    <input type="password" name="password" class="form-control" placeholder="Sua senha" required>
                </div>
            </div>

            <button type="submit" class="btn btn-purple w-100 fw-bold py-2 shadow-sm">
                Entrar no Sistema
            </button>
            
            <!-- Isso mantém o redirecionamento correto após o login -->
            <input type="hidden" name="next" value="{{ next }}">
        </form>
    </div>

</body>
</html>
