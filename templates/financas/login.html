{% load static %}
<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Meu Financeiro</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css" rel="stylesheet">
    
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Architects+Daughter&family=Patrick+Hand&display=swap');

        :root {
            --bg-color: #fcf9f5;
            --line-color: #e5dcd0;
            --mint-green: #b4e3d3;
            --purple: #d1b3e2;
            --border-dark: #222222;
        }

        body, html {
            height: 100%;
            margin: 0;
            font-family: 'Patrick Hand', cursive, sans-serif;
            background-color: var(--bg-color);
        }

        .login-wrapper {
            display: flex;
            height: 100vh;
            width: 100vw;
        }

        /* LADO ESQUERDO - CAPA DO CADERNO */
        .login-left {
            flex: 1;
            background-color: var(--purple);
            background-image: linear-gradient(var(--line-color) 1px, transparent 1px);
            background-size: 100% 28px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 3rem;
            text-align: center;
            position: relative;
            border-right: 4px solid var(--border-dark);
        }

        /* Efeito de fita adesiva no topo da capa */
        .login-left::before {
            content: '';
            position: absolute;
            top: 20px;
            left: 50%;
            transform: translateX(-50%) rotate(-2deg);
            width: 150px;
            height: 35px;
            background-color: rgba(255, 255, 255, 0.4);
            border: 1px solid rgba(0,0,0,0.1);
        }

        .brand-logo {
            font-family: 'Architects Daughter', cursive;
            font-size: 3.5rem;
            font-weight: bold;
            color: var(--border-dark);
            text-shadow: 3px 3px 0px rgba(0,0,0,0.15);
            margin-bottom: 1rem;
            z-index: 1;
            line-height: 1.1;
        }

        .brand-subtitle {
            font-size: 1.3rem;
            color: #444;
            z-index: 1;
            max-width: 400px;
            background-color: rgba(255,255,255,0.6);
            padding: 10px;
            border: 2px dashed var(--border-dark);
            border-radius: 4px;
            transform: rotate(-1deg);
        }

        /* LADO DIREITO - FORMULÁRIO */
        .login-right {
            flex: 1;
            background-color: var(--bg-color);
            background-image: linear-gradient(var(--line-color) 1px, transparent 1px);
            background-size: 100% 28px;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 2rem;
        }

        .form-container {
            width: 100%;
            max-width: 400px;
            background: white;
            padding: 3rem 2.5rem;
            border: 3px solid var(--border-dark);
            box-shadow: 8px 8px 0px var(--border-dark);
            border-radius: 4px;
            position: relative;
        }

        /* Fita adesiva no formulário */
        .form-container::before {
            content: '';
            position: absolute;
            top: -15px;
            right: 30px;
            transform: rotate(5deg);
            width: 80px;
            height: 30px;
            background-color: rgba(180, 227, 211, 0.8); /* Verde pastel */
            border: 1px solid rgba(0,0,0,0.1);
            box-shadow: 1px 1px 3px rgba(0,0,0,0.1);
        }

        .form-title {
            font-family: 'Architects Daughter', cursive;
            font-size: 2rem;
            color: var(--border-dark);
            margin-bottom: 0.5rem;
        }

        .form-control {
            border: 2px solid var(--border-dark) !important;
            border-radius: 4px !important;
            background-color: #fcf9f5 !important;
            font-family: 'Patrick Hand', cursive;
            font-size: 1.1rem;
            padding: 0.6rem 0.8rem;
        }

        .form-control:focus {
            box-shadow: 3px 3px 0px rgba(139, 92, 246, 0.3) !important;
            border-color: #8b5cf6 !important;
            background-color: #fff !important;
        }

        .input-group-text {
            background-color: var(--mint-green);
            border: 2px solid var(--border-dark);
            border-right: none;
            color: var(--border-dark);
            font-size: 1.1rem;
        }

        .btn-login {
            background: var(--mint-green);
            border: 2px solid var(--border-dark);
            border-radius: 4px;
            color: var(--border-dark);
            padding: 0.8rem;
            font-weight: bold;
            font-family: 'Architects Daughter', cursive;
            font-size: 1.2rem;
            box-shadow: 4px 4px 0px var(--border-dark);
            transition: all 0.1s;
        }

        .btn-login:hover {
            background: #81c7b3;
            transform: translate(2px, 2px);
            box-shadow: 2px 2px 0px var(--border-dark);
        }

        /* Responsividade */
        @media (max-width: 768px) {
            .login-left {
                display: none;
            }
        }
    </style>
</head>
<body>

    <div class="login-wrapper">
        <!-- LADO ESQUERDO (CAPA) -->
        <div class="login-left d-none d-md-flex">
            <div class="brand-logo">
                Meu<br>Financeiro
            </div>
            <div class="brand-subtitle">
                Anote, planeje e conquiste seus objetivos.
            </div>
        </div>

        <!-- LADO DIREITO (FORMULÁRIO) -->
        <div class="login-right">
            <div class="form-container">
                <div class="mb-4">
                    <div class="form-title">Acesse seu Caderno</div>
                    <p class="text-muted small" style="font-size: 1rem;">Insira suas credenciais para continuar.</p>
                </div>

                {% if form.errors %}
                    <div class="alert alert-danger py-2 text-center fw-bold" style="border: 2px solid #222; background-color: #f7b2bd; color: #222;">
                        <i class="bi bi-exclamation-triangle"></i> Usuário ou senha incorretos.
                    </div>
                {% endif %}

                <form method="post" action="{% url 'login' %}">
                    {% csrf_token %}
                    
                    <div class="mb-3">
                        <label class="form-label fw-bold text-dark">Usuário</label>
                        <div class="input-group">
                            <span class="input-group-text"><i class="bi bi-person"></i></span>
                            <input type="text" name="username" class="form-control" placeholder="Seu usuário" required autofocus>
                        </div>
                    </div>

                    <div class="mb-4">
                        <label class="form-label fw-bold text-dark">Senha</label>
                        <div class="input-group">
                            <span class="input-group-text"><i class="bi bi-lock"></i></span>
                            <input type="password" name="password" class="form-control" placeholder="Sua senha" required>
                        </div>
                    </div>

                    <button type="submit" class="btn btn-login w-100">
                        Entrar <i class="bi bi-box-arrow-in-right"></i>
                    </button>
                    
                    <input type="hidden" name="next" value="{{ next }}">
                </form>
            </div>
        </div>
    </div>

</body>
</html>
