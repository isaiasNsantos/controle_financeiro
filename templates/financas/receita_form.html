{% extends 'financas/base.html' %}

{% block title %}Editar Receita - Controle Financeiro{% endblock %}

{% block content %}
    <div class="row justify-content-center">
        <div class="col-md-6">
            <h5 class="mb-3 text-purple fw-bold">Editar Receita: {{ receita.descricao }}</h5>
            <div class="card card-form p-4">
                <form method="post">
                    {% csrf_token %}
                    <div class="mb-3">
                        <label class="form-label label-mini">Descrição</label>
                        {{ form.descricao }}
                    </div>
                    <div class="mb-3">
                        <label class="form-label label-mini">Valor (R$)</label>
                        {{ form.valor }}
                    </div>
                    <div class="mb-3">
                        <label class="form-label label-mini">Data</label>
                        {{ form.data }}
                    </div>
                    <div class="mb-3">
                        <label class="form-label label-mini">Pessoa</label>
                        {{ form.pessoa }}
                    </div>
                    <div class="d-flex gap-2">
                        <button type="submit" class="btn btn-neon flex-grow-1">Salvar Alterações</button>
                        <a href="{% url 'receita_lista' %}" class="btn btn-light border">Cancelar</a>
                    </div>
                </form>
            </div>
        </div>
    </div>
{% endblock %}
